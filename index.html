<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="15;url=https://opstool.ca">
  <title>CJT OPS Tool — Moved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:       #0a0c10;
      --panel:      #111318;
      --border:     #1e2230;
      --red:        #cc1e1e;
      --red-dim:    #6b0f0f;
      --red-glow:   rgba(204,30,30,0.10);
      --text:       #c8cdd8;
      --text-dim:   #5a6075;
      --text-label: #8890a4;
      --white:      #eef0f5;
      --mono:       'JetBrains Mono', monospace;
      --sans:       'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--void);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.25rem;
      position: relative;
      overflow: hidden;
    }

    /* Subtle horizon glow */
    body::before {
      content: '';
      position: fixed;
      bottom: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 120vw;
      height: 60vh;
      background: radial-gradient(ellipse at center bottom, rgba(204,30,30,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem 2.5rem 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    /* Amber top rule */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      border-radius: 1px;
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 1.5rem;
    }

    .icon-img {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.75rem;
    }


    h1 {
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--white);
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-size: 0.92rem;
      color: var(--text-label);
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }

    .new-url {
      font-family: var(--mono);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--red);
      background: var(--red-glow);
      border: 1px solid var(--red-dim);
      border-radius: 6px;
      padding: 0.65rem 1.1rem;
      display: inline-block;
      margin-bottom: 2rem;
      letter-spacing: 0.01em;
    }

    .cta {
      display: inline-block;
      background: var(--red);
      color: #f0f0f0;
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 0.75rem 2rem;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.15s;
      margin-bottom: 2.5rem;
    }

    .cta:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .cta:active {
      transform: translateY(0);
      opacity: 1;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 1.5rem;
    }

    .countdown-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    #countdown {
      color: var(--text-label);
      font-weight: 500;
      min-width: 1.6ch;
      display: inline-block;
      text-align: right;
    }

    .progress-track {
      width: 100%;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 0.9rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--red);
      border-radius: 2px;
      transition: width 1s linear;
    }

    @media (max-width: 480px) {
      .card { padding: 2.25rem 1.5rem 2rem; }
      h1 { font-size: 1.25rem; }
      .new-url { font-size: 0.92rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cta { transition: none; }
      .progress-fill { transition: none; }
    }
  </style>
</head>
